name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

jobs:
  release:
    name: Build APK & Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle Wrapper JAR
        working-directory: android
        run: |
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar

      - name: Create gradle-wrapper.properties
        working-directory: android
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Create gradlew script
        working-directory: android
        run: |
          cat > gradlew << 'GRADLEW'
          #!/bin/sh
          APP_HOME=$( cd "${0%/[!/]*}" > /dev/null && pwd -P ) || exit
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          JAVACMD=${JAVA_HOME:+$JAVA_HOME/bin/}java
          exec "$JAVACMD" -Xmx256m -Dorg.gradle.appname=gradlew -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEW
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "OTP Relay ${{ steps.version.outputs.tag }}"
          body: |
            ## OTP Relay ${{ steps.version.outputs.tag }}

            ### 📱 Android App

            **Download:** `otp-relay-debug.apk`

            ### Installation
            1. Download the APK file
            2. Open on Android device
            3. Allow "Install from Unknown Sources" if prompted
            4. Login with your credentials

            ### Default Credentials
            | Role | Email | Password |
            |------|-------|----------|
            | Super Admin | admin@otp-relay.gov.in | admin123 |
            | Office Admin | office.admin@palojori.gov.in | admin123 |
            | Operator | amit.kumar@palojori.gov.in | operator123 |
            | Staff | rajesh.kumar@palojori.gov.in | staff123 |

            ### Features
            - SMS OTP detection for authorized sender IDs only
            - Offline queue with automatic sync via WorkManager
            - Material 3 UI matching the web dashboard
            - Real-time OTP routing to operators
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
