<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Confirm OTP Usage - OTP Relay</title>

                        "outline": "#76777d",
                        "secondary-fixed": "#e1e0ff",
                        "secondary": "#4648d4",
                        "on-surface": "#0b1c30",
                        "on-tertiary-container": "#009668",
                        "secondary-fixed-dim": "#c0c1ff",
                        "surface-dim": "#cbdbf5",
                        "surface-variant": "#d3e4fe",
                        "on-error": "#ffffff",

                        "on-primary-container": "#7c839b",
                        "on-tertiary-fixed": "#002113",
                        "tertiary-fixed-dim": "#4edea3",
                        "surface-container-lowest": "#ffffff",
                        "background": "#f8f9ff",
                        "surface-bright": "#f8f9ff",
                        "surface-container-highest": "#d3e4fe",
                        "tertiary-container": "#002113",
                        "surface": "#f8f9ff",

                        "on-tertiary-fixed-variant": "#005236",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"

                    "spacing": {
                        "section-gap": "32px",
                        "unit": "8px",
                        "gutter": "16px",
                        "container-margin": "24px",
                        "tight": "4px"

                    "fontFamily": {
                        "body-lg": ["inter"],
                        "display-md": ["manrope"],

                    "fontSize": {

                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],

<body class="bg-background text-on-background font-body-md min-h-screen relative overflow-hidden flex flex-col md:flex-row">
<!-- Background: Dimmed Operator Live Dashboard -->
<div class="fixed inset-0 bg-surface-container-low opacity-50 z-0 select-none">
<!-- Minimal Dashboard Structure for context -->
<header class="flex justify-between items-center px-gutter w-full h-16 bg-background border-b border-outline-variant absolute top-0 w-full z-10">
<div class="font-display-md text-display-md font-bold text-primary">OTP Relay</div>
</header>
<div class="pt-20 px-container-margin grid grid-cols-1 md:grid-cols-3 gap-unit">
<div class="bg-surface-container-lowest p-gutter rounded-lg border border-outline-variant h-64">
<div class="font-headline-sm text-headline-sm mb-tight">Active OTPs</div>
<div class="bg-surface-container h-12 w-full rounded mb-tight"></div>
<div class="bg-surface-container h-12 w-full rounded"></div>
</div>
<div class="col-span-2 bg-surface-container-lowest p-gutter rounded-lg border border-outline-variant h-64">
<div class="font-headline-sm text-headline-sm mb-tight">Live Requests</div>
<div class="bg-surface-container h-8 w-full rounded mb-tight"></div>
<div class="bg-surface-container h-8 w-full rounded mb-tight"></div>
<div class="bg-surface-container h-8 w-full rounded"></div>
</div>
</div>
</div>
<!-- Modal Overlay Backdrop -->
<div class="fixed inset-0 bg-primary/40 backdrop-blur-sm z-40 flex items-center justify-center p-gutter transition-opacity duration-300">
<!-- Modal Container (Level 3 Elevation) -->
<div class="bg-surface-container-lowest w-full max-w-lg rounded-xl shadow-[0_16px_32px_rgba(0,0,0,0.08)] border border-outline-variant flex flex-col transform transition-transform duration-300 scale-100">
<!-- Modal Header -->
<div class="flex items-center justify-between px-container-margin py-gutter border-b border-outline-variant">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Confirm OTP Usage</h2>
<button class="text-on-surface-variant hover:text-on-surface hover:bg-surface-container p-unit rounded-full transition-colors flex items-center justify-center h-8 w-8 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
</div>
<!-- Modal Content -->
<div class="px-container-margin py-container-margin flex flex-col gap-container-margin">
<!-- Summary Section (Level 1 Card style) -->
<div class="bg-surface border border-outline-variant rounded-lg p-gutter">
<div class="grid grid-cols-2 gap-y-unit gap-x-gutter mb-gutter">
<div>
<span class="font-label-sm text-label-sm text-on-surface-variant block uppercase">Staff</span>
<span class="font-body-md text-body-md text-on-surface font-medium">Rajesh Kumar</span>
</div>
<div>
<span class="font-label-sm text-label-sm text-on-surface-variant block uppercase">Department</span>
<span class="font-body-md text-body-md text-on-surface font-medium">VBGRAMG</span>
</div>
<div>
<span class="font-label-sm text-label-sm text-on-surface-variant block uppercase">Purpose</span>
<span class="font-body-md text-body-md text-on-surface font-medium">FTO Login</span>
</div>
<div>
<span class="font-label-sm text-label-sm text-on-surface-variant block uppercase">Reference</span>
<span class="font-mono-data text-mono-data text-on-surface">000123</span>
</div>
<div>
<span class="font-label-sm text-label-sm text-on-surface-variant block uppercase">Requested At</span>
<span class="font-body-md text-body-md text-on-surface text-sm">Oct 24, 2026, 14:32</span>
</div>
</div>
<!-- Prominent OTP Display -->
<div class="bg-primary-container/5 border border-primary/10 rounded-lg p-unit text-center flex flex-col items-center justify-center">
<span class="font-label-sm text-label-sm text-primary uppercase tracking-widest mb-tight">OTP VALUE</span>
<span class="font-display-lg text-display-lg text-primary tracking-widest bg-clip-text">980 847</span>
</div>
</div>
<!-- Form Field -->
<div class="flex flex-col gap-tight">
<label class="font-body-md text-body-md text-on-surface font-medium flex items-center justify-between" for="usage-note">
                        Usage Note <span class="text-error">*</span>
</label>
<textarea class="w-full rounded-md border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder-on-surface-variant/60 focus:border-primary focus:ring-1 focus:ring-primary resize-none transition-colors" id="usage-note" placeholder="Explain what this OTP was used for..." rows="3"></textarea>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Example: FTO login completed for Reference 000123.</p>
</div>
</div>
<!-- Actions Footer -->
<div class="flex items-center justify-end px-container-margin py-gutter border-t border-outline-variant bg-surface-container-low rounded-b-xl gap-unit">
<button class="px-4 py-2 font-body-md text-body-md font-medium text-on-surface bg-surface-container-lowest border border-outline-variant rounded-md hover:bg-surface-container transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1" type="button">
                    Cancel
                </button>
<button class="px-4 py-2 font-body-md text-body-md font-medium text-on-primary bg-secondary rounded-md hover:bg-secondary/90 transition-colors flex items-center gap-2 focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-1 shadow-sm" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="check_circle">check_circle</span>
                    Confirm &amp; Mark Used
                </button>
</div>
</div>
</div>
</body></html>
